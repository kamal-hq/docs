name: Sync Project Documentation

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: Optional single repository name to sync (ignores topic filter)
        required: false
        default: ''
      sync_all:
        description: Scan all non-fork repositories instead of only topic "docs-sync"
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types: [sync-project]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync GitHub repositories into docs registry
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          DOCS_REPO_NAME: ${{ github.event.repository.name }}
          TARGET_REPO: ${{ github.event.inputs.repo || github.event.client_payload.repo || '' }}
          SYNC_ALL: ${{ github.event.inputs.sync_all || 'false' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/sync-github-docs.mjs

      - name: Verify build with synced data
        run: |
          pnpm run typecheck
          pnpm run build

      - name: Open or update documentation PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet src/data/synced/; then
            echo "No documentation updates detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/sync-docs
          git add src/data/synced/
          git commit -m "docs: sync project documentation"
          git push origin HEAD:chore/sync-docs --force-with-lease
          if ! gh pr view chore/sync-docs --json number >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head chore/sync-docs \
              --title "docs: sync updated GitHub project documentation" \
              --body "Automated documentation sync generated by scripts/sync-github-docs.mjs. Review and merge to publish to GitHub Pages and Vercel."
          fi
